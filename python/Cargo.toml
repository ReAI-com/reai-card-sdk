[workspace]

[package]
name = "reai-card-py"
version = "0.0.10"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Official Python bindings (PyO3 + maturin) for reai-card-sdk"

[lib]
name = "reai_card"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py310", "extension-module"] }
reai-card-sdk = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
