[package]
name = "reai-card-sdk"
version = "0.0.4"
edition = "2024"
rust-version = "1.93"
description = "Async Rust SDK for ReAI recorder cards (DYJ): BLE control, realtime ADPCM audio, AP fast transfer"
license = "MIT"
repository = "https://github.com/ReAI-com/reai-card-sdk"
readme = "README.md"
keywords = ["ble", "bluetooth", "recorder", "adpcm", "sdk"]
categories = ["hardware-support", "api-bindings"]

[features]
default = ["btleplug"]
btleplug = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
btleplug = "0.12"
chrono = "0.4"
crc32fast = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util", "fs"] }
tracing = "0.1"
uuid = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "fs", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
